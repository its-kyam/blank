[package]
name = "blank-web"
description = "A lightning-fast web framework where DX is as important as UX, Self implemented Co-Routines"
repository = "https://github.com/its-kyam/blank"
license = "MIT OR Apache-2.0"
authors = ["Kushaal Bandi <koolcoolkoolcoolkoolkool@gmail.com"]
version = "0.2.0"
edition = "2024"

[dependencies]

# Production build configuration
[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
strip = true

# Test build configuration
[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
